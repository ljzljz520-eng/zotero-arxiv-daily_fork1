name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    env:
      # Persistent home for the incremental sync watermark and embedding cache.
      ZOTERO_STATE_DIR: ${{ github.workspace }}/.zotero_sync
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Restore Zotero sync state
        uses: actions/cache@v4
        with:
          path: .zotero_sync
          # An exact (static) key would hit every day and actions/cache never
          # re-saves on an exact hit, freezing the watermark at day one. The
          # per-run key component forces a miss (=> fresh snapshot saved);
          # restore-keys pull the newest prior snapshot for this account/OS.
          key: "zotero-sync-${{ runner.os }}-${{ secrets.ZOTERO_ID }}-${{ github.run_id }}"
          restore-keys:
            - "zotero-sync-${{ runner.os }}-${{ secrets.ZOTERO_ID }}-"
            - "zotero-sync-${{ runner.os }}-"
        # The action's post-step saves the cache even when the run script fails.

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py
